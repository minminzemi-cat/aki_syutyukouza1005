<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>空中砲撃遮断</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>空中砲撃遮断</h1>
      <div class="hud">
        <div>残り時間 <span id="time-left">20.0</span> 秒</div>
        <div>撃墜数 <span id="score">0</span></div>
      </div>
      <canvas id="game" width="900" height="600" aria-label="シューティングゲーム"></canvas>
      <div class="controls">
        <p>マウスを動かして照準を合わせ、クリックで発射します。</p>
        <button id="restart" type="button">もう一度プレイ</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
